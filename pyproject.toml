[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tlsocket"
version = "0.1.0"
description = "Secure socket library with TLS and authentication utilities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3"]

[project.scripts]
tlsocket-server = "tlsocket.server_side.server:main"
tlsocket-client = "tlsocket.client_side.client:main"
tlsocket-analyze = "tlsocket.log_parser.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tlsocket"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: cần khởi động server thật qua socket (chậm hơn)"
]
timeout = 30
