name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src/tlsocket/auth src/tlsocket/security src/tlsocket/log_parser

      - name: Pytest + coverage gate (auth/security/log_parser >= 80%)
        run: |
          pytest tests/unit \
            --cov=tlsocket.auth --cov=tlsocket.security \
            --cov=tlsocket.log_parser.parser --cov=tlsocket.log_parser.analyzer --cov=tlsocket.log_parser.models \
            --cov-report=term-missing --cov-fail-under=80

      - name: Full test suite (unit + integration) + coverage report
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
